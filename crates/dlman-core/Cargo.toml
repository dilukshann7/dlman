[package]
name = "dlman-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Core download engine for DLMan"

[dependencies]
dlman-types = { workspace = true }

# Async runtime
tokio = { workspace = true }
tokio-util = { workspace = true, features = ["io"] }
tokio-stream = "0.1"

# HTTP client
reqwest = { workspace = true }

# Rate limiting
governor = "0.6"

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Database
sqlx = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }

# Utilities
uuid = { workspace = true }
chrono = { workspace = true }
url = { workspace = true }
urlencoding = "2.1"
futures = { workspace = true }
parking_lot = { workspace = true }
directories = { workspace = true }
# Cross-platform free-space detection (used by the `auto` temp-storage policy)
fs2 = "0.4"
async-trait = "0.1"
sha2 = "0.10"
tempfile = "3.24"

# XML parsing (for DASH MPD)
quick-xml = "0.36"

[dev-dependencies]
tokio-test = "0.4"

[build-dependencies]
serde_json = { workspace = true }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Security", "Win32_Security_Authorization"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
