[package]
name = "dlman-desktop"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "DLMan Desktop Application"

[build-dependencies]
tauri-build = { workspace = true, features = [] }

[dependencies]
dlman-core = { workspace = true }
dlman-types = { workspace = true }

tauri = { workspace = true, features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
tauri-plugin-deep-link = "2"
# 2.11 checks Windows installer launch failures before exiting (needed for retry).
tauri-plugin-updater = "=2.11.0"
reqwest = { workspace = true }
semver = "1"
base64 = "0.22"
minisign-verify = "0.2"
# tauri-plugin-drag = "2" # DISABLED: Causes crash on macOS "Rust cannot catch foreign exceptions"

tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
directories = { workspace = true }
urlencoding = "2"

# Browser extension integration server
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors"] }
futures-util = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.55"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "=2.5.1"

[features]
# Editor checks use devUrl without requiring generated frontend assets.
# The Tauri CLI enables custom-protocol when packaging the application.
default = []
custom-protocol = ["tauri/custom-protocol"]
devtools = ["tauri/devtools"]

[lib]
name = "dlman_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "dlman-desktop"
path = "src/main.rs"
